<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Корзина</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        .total { font-size: 1.3em; font-weight: bold; color: #e63946; margin-top: 20px; }
        a.btn { display: inline-block; background: #e63946; color: #fff; padding: 8px 14px;
                text-decoration: none; border-radius: 6px; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>🛒 Корзина</h1>
    {% if items %}
        <table>
            <tr><th>Товар</th><th>Цена</th><th>Кол-во</th><th>Сумма</th></tr>
            {% for it in items %}
                <tr>
                    <td>{{ it.name }}</td>
                    <td>{{ it.price }} ₽</td>
                    <td>{{ it.qty }}</td>
                    <td>{{ it.subtotal }} ₽</td>
                </tr>
            {% endfor %}
        </table>
        <p class="total">Итого: {{ total }} ₽</p>
        <a class="btn" href="/clear">Очистить корзину</a>
        <a class="btn" href="/">Продолжить покупки</a>
    {% else %}
        <p>Корзина пуста.</p>
        <a class="btn" href="/">В каталог</a>
    {% endif %}
</body>
</html>
